# Generated by prism generate (consumer workspace layout).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality & build
    runs-on: ubuntu-latest
    env:
      CI: "true"
      NO_COLOR: "1"
      FORCE_COLOR: "0"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?sslmode=disable
      DATABASE_URL_UNPOOLED: postgresql://ci:ci@127.0.0.1:5432/ci?sslmode=disable
      GOOGLE_MAPS_API_KEY: ci_dummy_not_used_at_build
      BETTER_AUTH_SECRET: ci_dummy_better_auth_secret_32_chars!!
      BETTER_AUTH_URL: http://localhost:3000

    steps:
      - name: Checkout (with Prism submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Clone Prism (pinned — no gitlink in this tree)
        # Snapshot pushes cannot create the prism/ submodule gitlink, so CI
        # clones Prism at the pinned SHA instead (see SCAFFOLD.md).
        run: |
          git clone https://github.com/thushana/prism.git prism
          git -C prism checkout d5a0f7defdad76415bf74d1caccde48e743b2dfc

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Knip (dependencies)
        run: pnpm run knip

      - name: Tests
        run: pnpm run test:run

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-next-

      - name: Build
        run: pnpm run build
