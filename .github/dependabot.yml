version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      react-next:
        patterns:
          - "react"
          - "react-dom"
          - "next"
          - "eslint-config-next"
      typescript-eslint:
        patterns:
          - "@typescript-eslint/*"
          - "typescript-eslint"

  - package-ecosystem: "npm"
    directory: "/prism"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      react-next:
        patterns:
          - "react"
          - "react-dom"
          - "next"
          - "eslint-config-next"
      typescript-eslint:
        patterns:
          - "@typescript-eslint/*"
          - "typescript-eslint"

  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "prism"
      include: "scope"
